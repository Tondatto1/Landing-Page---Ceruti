    <script>
      // A resume token is a short-lived bearer secret. Capture and remove it
      // synchronously, before any third-party tracking script can read the URL.
      (function () {
        var params = new URLSearchParams(window.location.search);
        var resumeToken = params.get('resume');
        if (!resumeToken) return;

        window.__CERUTI_CHECKOUT_RESUME_TOKEN__ = resumeToken;
        params.delete('resume');
        var nextUrl = window.location.pathname
          + (params.toString() ? '?' + params.toString() : '')
          + window.location.hash;
        window.history.replaceState(window.history.state, document.title, nextUrl);
      }());
    </script>
